# yaml-language-server: $schema=https://cloud.dqops.com/dqo-yaml-schema/TableYaml-schema.json
apiVersion: dqo/v1
kind: table
spec:
  incremental_time_window:
    daily_partitioning_recent_days: 7
    monthly_partitioning_recent_months: 1
  columns:
    Transaction_ID:
      type_snapshot:
        column_type: VARCHAR
        nullable: true
    Transaction_Date:
      type_snapshot:
        column_type: VARCHAR
        nullable: true
    Customer_ID:
      type_snapshot:
        column_type: VARCHAR
        nullable: true
    Product_Name:
      type_snapshot:
        column_type: VARCHAR
        nullable: true
    Quantity:
      type_snapshot:
        column_type: DOUBLE
        nullable: true
    Price:
      type_snapshot:
        column_type: VARCHAR
        nullable: true
    Payment_Method:
      type_snapshot:
        column_type: VARCHAR
        nullable: true
    Transaction_Status:
      type_snapshot:
        column_type: VARCHAR
        nullable: true
  file_format:
    file_paths:
    - /dqo/userhome/data/data.csv
