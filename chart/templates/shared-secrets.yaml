{{- /* Shared secrets used by Spark jobs, Airflow DAGs, and FastAPI */ -}}

# ==================== MINIO SECRET ====================
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: {{ include "chart.namespace" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app: shared
type: Opaque
stringData:
  MINIO_ACCESS_KEY: {{ .Values.minio.credentials.rootUser }}
  MINIO_SECRET_KEY: {{ .Values.minio.credentials.rootPassword }}
  MINIO_ENDPOINT: "http://minio-svc:9000"

# ==================== INTERNAL DATABASE SECRET ====================
---
apiVersion: v1
kind: Secret
metadata:
  name: internal-db-secret
  namespace: {{ include "chart.namespace" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app: shared
type: Opaque
stringData:
  INTERNAL_DB_HOST: "fastapi-postgres"
  INTERNAL_DB_PORT: "5432"
  INTERNAL_DB_NAME: {{ .Values.fastapi.postgres.database }}
  INTERNAL_DB_USER: {{ .Values.fastapi.postgres.user }}
  INTERNAL_DB_PASSWORD: {{ .Values.fastapi.postgres.password }}

# ==================== SOURCE DATABASE SECRET ====================
---
apiVersion: v1
kind: Secret
metadata:
  name: source-db-secret
  namespace: {{ include "chart.namespace" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app: shared
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.credentials.user }}
  POSTGRES_PASSWORD: {{ .Values.postgres.credentials.password }}
